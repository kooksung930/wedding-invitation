<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4efe8" />
    <meta name="description" content="국성 & 가영의 결혼식 사진을 남겨주세요." />
    <title>결혼식 사진 남기기 | 국성 & 가영</title>
    <link rel="preload" as="font" href="font/MaruBuri-Regular.woff2" type="font/woff2" crossorigin />
    <link rel="preload" as="font" href="font/MaruBuri-SemiBold.woff2" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="guest-photo.css?v=20260901-1" />
    <style>
      .music-button{position:fixed;right:18px;bottom:18px;padding:10px 13px;border:1px solid #d9cec2;border-radius:999px;background:#fffdf9;color:#77695e;font:inherit;font-size:11px;box-shadow:0 5px 16px #6653461c;cursor:pointer}.music-button.is-playing{background:#776454;color:#fff}
      .photo-preview.photo-preview--multiple{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:6px}.photo-preview--multiple img{width:100%;height:110px;object-fit:cover;border-radius:2px}
    </style>
    <script>
      window.WEDDING_CONFIG = {
        firebaseConfig: {
          apiKey: "AIzaSyDaGOxomY9IWP6kqAvth7bm9cGrw3QwkpM",
          authDomain: "wedding-e262a.firebaseapp.com",
          projectId: "wedding-e262a",
          storageBucket: "wedding-e262a.firebasestorage.app",
          messagingSenderId: "16876005547",
          appId: "1:16876005547:web:02684611d089df33daefee",
        },
      };
    </script>
  </head>
  <body>
    <audio id="bgm-player" src="resource/bgm.mp3?v=20260802-3" loop preload="auto" playsinline></audio>
    <main class="photo-page">
      <a class="back-link" href="index.html">← 모바일 청첩장으로 돌아가기</a>
      <section class="photo-card">
        <p class="eyebrow">OUR WEDDING RECORD</p>
        <h1>오늘의 순간을<br />남겨주세요</h1>
        <p class="intro">결혼식에서 찍은 사진과 축하의 말을<br />두 사람에게 선물해주세요.</p>

        <form id="guest-photo-form" novalidate>
          <label class="field-label" for="photo-file">사진</label>
          <label class="file-picker" for="photo-file">
            <span id="file-picker-label">사진을 여러 장 선택해주세요</span>
            <span class="file-picker__button">찾아보기</span>
          </label>
          <input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp,image/heic" multiple required />
          <p class="field-help">사진 여러 장 가능 · HEIC 자동 변환 · 업로드 전에 용량을 줄여요 · 원본 최대 50MB</p>
          <div class="photo-preview photo-preview--multiple" id="photo-preview" hidden>
          </div>

          <label class="field-label" for="guest-name">이름</label>
          <input id="guest-name" class="text-input" type="text" maxlength="20" placeholder="성함을 남겨주세요" autocomplete="name" required />

          <label class="field-label" for="guest-message">한마디 <span>(선택)</span></label>
          <textarea id="guest-message" class="text-input text-area" maxlength="160" placeholder="두 사람에게 전하고 싶은 말을 남겨주세요."></textarea>

          <label class="consent">
            <input id="guest-consent" type="checkbox" required />
            <span>업로드한 사진이 신랑·신부에게 전달되는 것에 동의합니다.</span>
          </label>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
          <button class="submit-button" id="submit-button" type="submit">사진 남기기</button>
        </form>
      </section>
      <p class="footer-note">소중한 사진은 두 사람의 결혼식 기록으로 간직할게요.</p>
    </main>
    <button class="music-button" id="music-button" type="button" aria-label="음악 재생">♫ 음악 켜기</button>
    <script defer src="guest-photo.js?v=20260901-7"></script>
  </body>
</html>
