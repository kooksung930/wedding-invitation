<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4efe8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="국성 & 가영의 결혼식 사진을 남겨주세요." />
    <title>결혼식 사진 남기기 | 국성 & 가영</title>
    <link rel="preload" as="font" href="font/MaruBuri-Regular.woff2" type="font/woff2" crossorigin />
    <link rel="preload" as="font" href="font/MaruBuri-SemiBold.woff2" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="guest-photo.css?v=20260902-8" />
    <style>
      .music-button{position:fixed;right:18px;bottom:18px;padding:10px 13px;border:1px solid #d9cec2;border-radius:999px;background:#fffdf9;color:#77695e;font:inherit;font-size:11px;box-shadow:0 5px 16px #6653461c;cursor:pointer}.music-button.is-playing{background:#776454;color:#fff}
      .photo-preview.photo-preview--multiple{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:6px}.photo-preview--multiple img{width:100%;height:110px;object-fit:cover;border-radius:2px}
      .music-button{display:none}.bgm-player{position:fixed;right:18px;bottom:18px;z-index:10;display:flex;align-items:center;gap:4px;width:260px;padding:6px 8px;border:1px solid #d9cec2;border-radius:999px;background:#fffdf9;color:#77695e;box-shadow:0 5px 16px #6653461c}.bgm-player__button{flex:0 0 28px;width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:#77695e;font:inherit;font-size:10px;cursor:pointer}.bgm-player__button--main{background:#776454;color:#fff}.bgm-player__title{min-width:0;flex:1;overflow:hidden;padding:0 5px;font-size:11px;text-align:center;white-space:nowrap}.bgm-player__title-text{display:inline-block;padding-right:10px}.bgm-player__title.is-long .bgm-player__title-text{animation:bgm-title-marquee 7s ease-in-out infinite alternate}@keyframes bgm-title-marquee{from{transform:translateX(0)}to{transform:translateX(-100px)}}
      .bgm-player__info{min-width:0;flex:1 1 auto}.bgm-player__seek{display:block;width:100%;height:10px;accent-color:#776454}
      .bgm-player{left:50%;right:auto;transform:translateX(-50%)}.bgm-player__button{display:grid;place-items:center;flex:0 0 28px;min-width:28px;padding:0}
      .bgm-player__info{display:block!important;width:0!important;min-width:0!important;flex:1 1 0!important;overflow:hidden!important}.bgm-player__title{display:block!important;width:100%!important;max-width:none!important;min-width:0!important;overflow:hidden!important}.bgm-player__button{position:relative;z-index:1;flex:0 0 28px!important;min-width:28px!important}
      #photo-preview.photo-preview--multiple{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px!important;padding:6px!important}#photo-preview.photo-preview--multiple img{width:100%!important;height:110px!important;max-height:none!important;object-fit:cover!important;border-radius:2px!important}
    </style>
    <script>
      window.WEDDING_CONFIG = {
        firebaseConfig: {
          apiKey: "AIzaSyDaGOxomY9IWP6kqAvth7bm9cGrw3QwkpM",
          authDomain: "wedding-e262a.firebaseapp.com",
          projectId: "wedding-e262a",
          storageBucket: "wedding-e262a.firebasestorage.app",

          appId: "1:16876005547:web:02684611d089df33daefee",
        },
      };
    </script>
  </head>
  <body>
    <audio id="bgm-player" src="resource/bgm/%EA%B0%80%EC%A0%95%EC%9D%84%EB%A7%8C%EB%93%A4%EC%9E%90.mp3" loop preload="auto" playsinline></audio>
    <main class="photo-page">
      <a class="back-link" href="index.html">← 모바일 청첩장으로 돌아가기</a>
      <section class="photo-card">
        <p class="eyebrow">OUR WEDDING RECORD</p>
        <h1>오늘의 순간을<br />남겨주세요</h1>
        <p class="intro">결혼식에서 찍은 사진과 축하의 말을<br />두 사람에게 선물해주세요.</p>
        <p class="photo-reward">사진을 보내주시면 추첨을 통해 소정의 선물을 드립니다.</p>

        <form id="guest-photo-form" novalidate>
          <label class="field-label" for="photo-file">사진</label>
          <label class="file-picker" for="photo-file">
            <span id="file-picker-label">사진을 여러 장 선택해주세요</span>
            <span class="file-picker__button">찾아보기</span>
          </label>
          <input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp,image/heic" multiple required />
          <p class="field-help">사진 최대 9장까지 가능, 사진 1장당 최대 50MB</p>
          <div class="photo-preview photo-preview--multiple" id="photo-preview" hidden>
          </div>

          <label class="field-label" for="guest-name">이름</label>
          <input id="guest-name" class="text-input" type="text" maxlength="20" placeholder="성함을 남겨주세요" autocomplete="name" required />

          <label class="field-label" for="guest-message">한마디 <span>(선택)</span></label>
          <textarea id="guest-message" class="text-input text-area" maxlength="160" placeholder="두 사람에게 전하고 싶은 말을 남겨주세요."></textarea>

          <button class="submit-button" id="submit-button" type="submit">사진 남기기</button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
        <p class="footer-note footer-note--drive"><a href="https://drive.google.com/drive/folders/1jViWacJPtlnwcvEHc54v9gV7nCMgc1PV?usp=sharing" target="_blank" rel="noopener">업로드가 안 되면 여기를 눌러<br />Google Drive에 업로드해주세요</a><span>Google Drive에 업로드할 때는<br />파일명을 본인 이름으로 바꿔서 올려주세요.</span></p>
      </section>
      <p class="footer-note">소중한 사진은 두 사람의 결혼식 기록으로 간직할게요.</p>
    </main>
    <button class="music-button" id="music-button" type="button" aria-label="음악 재생">♫ 음악 켜기</button>
    <script defer src="guest-photo.js?v=20260902-37"></script>
    <div class="bgm-player" aria-label="배경음악 플레이어">
      <button class="bgm-player__button" id="bgm-prev" type="button" aria-label="이전 곡">◀</button>
      <button class="bgm-player__button bgm-player__button--main" id="bgm-toggle" type="button" aria-label="재생 또는 일시정지">▶</button>
      <button class="bgm-player__button" id="bgm-next" type="button" aria-label="다음 곡">▶</button>
      <span class="bgm-player__info"><span class="bgm-player__title" id="bgm-title"><span class="bgm-player__title-text">가정을만들자</span></span><input class="bgm-player__seek" id="bgm-seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="재생 위치" /></span>
    </div>
  </body>
</html>
